services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_URL=http://localhost:5000
      - WATCHPACK_POLLING=true
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - backend
      - ml_service

  backend:
    build: ./backend
    env_file:
      - .env
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/coldchain
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - SEPOLIA_PRIVATE_KEY=${SEPOLIA_PRIVATE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on: [db, redis]

  ml_service:
    build: ./ml_service
    env_file:
      - .env
    ports: ["5000:5000"]
    volumes:
      - ./ml_service/models:/app/models

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
